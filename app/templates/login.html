{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="text-center mb-4">
    <div style="font-size:2.5rem">&#128737;</div>
    <h1 class="h4 mb-1">Digital Evidence Chain-of-Custody</h1>
    <p class="text-muted small">Authorized personnel only. All activity is recorded.</p>
  </div>
  <div class="card p-4">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <input class="form-control" id="username" name="username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" required>
      </div>
      <button class="btn btn-primary w-100">Sign in</button>
    </form>
  </div>
  <p class="text-center text-muted small mt-3">Accounts lock for 15 minutes after 5 failed attempts.</p>
</div>
{% endblock %}
